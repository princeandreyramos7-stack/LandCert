<!DOCTYPE html>
<html>
<head>
    <title>Test Application Submission</title>
    <script>
        async function testSubmit() {
            const log = document.getElementById('log');
            log.innerHTML = 'Testing submission...\n';
            
            try {
                const response = await fetch('/request', {
                    method: 'POST',
                    headers: {
                        'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]').content,
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        declaration: '1',
                        applicant_name: 'Test User'
                    })
                });
                
                log.innerHTML += `Status: ${response.status}\n`;
                log.innerHTML += `OK: ${response.ok}\n`;
                
                const data = await response.json();
                log.innerHTML += `Response: ${JSON.stringify(data, null, 2)}\n`;
            } catch (e) {
                log.innerHTML += `Error: ${e.message}\n`;
            }
        }
    </script>
</head>
<body style="padding: 20px; font-family: monospace;">
    <h2>Test Application Submission</h2>
    <button onclick="testSubmit()">Test Submit</button>
    <pre id="log" style="background: #f5f5f5; padding: 10px; margin-top: 20px;"></pre>
    <meta name="csrf-token" content="{{ csrf_token() }}">
</body>
</html>
